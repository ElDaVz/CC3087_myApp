name: FormLink quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, unit tests, Lint and APK
        run: ./gradlew compileDebugKotlin testDebugUnitTest lintDebug assembleDebug --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
  web-and-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            backend-tests/package-lock.json
      - run: npm ci --prefix backend-tests
      - run: npm ci --prefix web
        if: hashFiles('web/package-lock.json') != ''
      - run: npm run build --prefix web && npm test --prefix web
        if: hashFiles('web/package-lock.json') != ''
      - run: web/node_modules/.bin/playwright install --with-deps --no-shell chromium
        if: hashFiles('web/package-lock.json') != ''
      - name: Rules against local backend
        working-directory: backend-tests
        run: node_modules/.bin/firebase emulators:exec --config ../firebase.json --project demo-formlink --only auth,firestore "node --test *.test.mjs"
      - name: Browser flow against local backend
        if: hashFiles('web/package-lock.json') != ''
        run: backend-tests/node_modules/.bin/firebase emulators:exec --project demo-formlink --only auth,firestore "npm run test:e2e --prefix web"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-reports
          path: |
            web/test-results/
            web/playwright-report/
            firestore-debug.log
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-tests/package-lock.json
      - run: npm ci --prefix backend-tests
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: backend-tests/node_modules/.bin/firebase emulators:exec --project demo-formlink --only auth,firestore "./gradlew connectedDebugAndroidTest -PfirebaseEmulators=true -Pandroid.testInstrumentationRunnerArguments.backendEmulators=true --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
